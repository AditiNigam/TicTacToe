
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header class="header">
            <div class="brand"><span class="brand-icon">✳</span> PLAYROOM</div>
            <h1>Tic Tac <span>Toe</span></h1>
            <p>A little competition never hurt anyone.</p>
        </header>

        <section class="mode-picker">
            <button class="mode-btn selected" id="computer-mode">
                <span class="mode-icon">◈</span>
                <span class="mode-name">Vs Computer</span>
                <span class="mode-desc">Solo challenge</span>
            </button>
            <button class="mode-btn" id="two-player-mode">
                <span class="mode-icon">♟</span>
                <span class="mode-name">Two Players</span>
                <span class="mode-desc">Play together</span>
            </button>
        </section>

        <section class="game-card">
            <div class="players">
                <div class="player active" id="player-one-card">
                    <div class="symbol symbol-o">O</div>
                    <div class="player-info">
                        <span class="player-label" id="player-one-name">YOU</span>
                        <span class="player-role" id="player-one-role">Player 1</span>
                    </div>
                    <span class="turn-tag" id="player-one-tag">YOUR TURN</span>
                </div>

                <div class="player" id="player-two-card">
                    <div class="symbol symbol-x">X</div>
                    <div class="player-info">
                        <span class="player-label" id="player-two-name">COMPUTER</span>
                        <span class="player-role" id="player-two-role">Player 2</span>
                    </div>
                    <span class="turn-tag" id="player-two-tag">WAITING</span>
                </div>
            </div>

            <div class="game-status" aria-live="polite">
                <span class="status-dot"></span>
                <span id="status">Your turn. Pick a square!</span>
            </div>

            <div class="board" id="board" aria-label="Tic Tac Toe board">
                <button class="cell" data-index="0" aria-label="Square 1"></button>
                <button class="cell" data-index="1" aria-label="Square 2"></button>
                <button class="cell" data-index="2" aria-label="Square 3"></button>
                <button class="cell" data-index="3" aria-label="Square 4"></button>
                <button class="cell" data-index="4" aria-label="Square 5"></button>
                <button class="cell" data-index="5" aria-label="Square 6"></button>
                <button class="cell" data-index="6" aria-label="Square 7"></button>
                <button class="cell" data-index="7" aria-label="Square 8"></button>
                <button class="cell" data-index="8" aria-label="Square 9"></button>
            </div>

            <div class="board-note" id="board-note">
                <span>ⓘ</span> Computer starts in the center
            </div>

            <div class="actions">
                <button class="primary-btn" id="restart-btn">
                    <span>↻</span> New Round
                </button>
                <button class="secondary-btn" id="reset-score-btn">
                    Reset Scores
                </button>
            </div>
        </section>

        <section class="score-section">
            <div class="score-heading">
                <span>YOUR RECORD</span>
                <span class="score-mode" id="score-mode">VS COMPUTER</span>
            </div>
            <div class="scoreboard">
                <div class="score-box">
                    <span class="score-caption" id="score-one-label">Your wins</span>
                    <strong id="score-one">0</strong>
                </div>
                <div class="score-box">
                    <span class="score-caption">Draws</span>
                    <strong id="score-draw">0</strong>
                </div>
                <div class="score-box">
                    <span class="score-caption" id="score-two-label">Computer wins</span>
                    <strong id="score-two">0</strong>
                </div>
            </div>
        </section>

        <footer>MADE WITH <span>♥</span> & A LITTLE STRATEGY</footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
